openapi: 3.1.0
info:
  title: SAR Umbria OpenAPI - Servizi per il prescrittore
  version: v1 
servers:
  - url: https://api-salute-test.regione.umbria.it/sar
    description: Ambiente di test
    x-sandbox: true
  - url: https://api-salute.regione.umbria.it/sar
    description: Ambiente di produzione
    x-sandbox: false
paths:
  /v1/servizi-prescrittore/richiesta-lotto-nre:
    post:
      tags:
        - Servizi comuni
      operationId: richiestaLottoNRE
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LottoRichiestaNRE'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LottoRicevutaNRE'
  /v1/servizi-prescrittore/dem-nre-utilizzati:
    post:
      tags:
        - Servizi comuni
      operationId: nreUtilizzati
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterrogaNreUtilRichiesta'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InterrogaNreUtilRicevuta'
  /v1/servizi-prescrittore/sostituzione-medico:
    post:
      tags:
        - Servizi comuni
      operationId: cambioMedico
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DichiarazioneSostituzioneMedicoRichiesta'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DichiarazioneSostituzioneMedicoRicevuta'
  /v1/servizi-prescrittore/dem-invio-prescritto:
    post:
      tags:
        - Ricette dematerializzate
      operationId: demInvioPrescritto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvioPrescrittoRichiesta'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvioPrescrittoRicevuta'
  /v1/servizi-prescrittore/dem-visualizza-prescritto:
    post:
      tags:
        - Ricette dematerializzate
      operationId: demVisualizzaPrescritto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisualizzaPrescrittoRichiesta'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VisualizzaPrescrittoRicevuta'
  /v1/servizi-prescrittore/dem-annulla-prescritto:
    post:
      tags:
        - Ricette dematerializzate
      operationId: demAnnullaPrescritto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnullaPrescrittoRichiesta'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnnullaPrescrittoRicevuta'
  /v1/servizi-prescrittore/dpcm-invio-prescritto:
    post:
      tags:
        - Ricette rosse
      operationId: dpcmInvioPrescritto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvioPrescrittoRichiesta'
        required: true
      responses:
        '200':
          description: OK
  /v1/servizi-prescrittore/dpcm-visualizza-prescritto:
    post:
      tags:
        - Ricette rosse
      operationId: dpcmVisualizzaPrescritto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisualizzaPrescrittoRichiesta'
        required: true
      responses:
        '200':
          description: OK
  /v1/servizi-prescrittore/dpcm-annulla-prescritto:
    post:
      tags:
        - Ricette rosse
      operationId: dpcmAnnullaPrescritto
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnullaPrescrittoRichiesta'
        required: true
      responses:
        '200':
          description: OK
components:
  schemas:
    ComunicazioneType:
      type: object
      properties:
        codice:
          type: string
        messaggio:
          type: string
      required:
        - codice
        - messaggio
    ElencoComunicazioniType:
      type: object
      properties:
        comunicazione:
          type: array
          items:
            $ref: '#/components/schemas/ComunicazioneType'
          xml:
            name: Comunicazione
      required:
        - comunicazione
    ElencoErroriRicetteType:
      type: object
      properties:
        erroreRicetta:
          type: array
          items:
            $ref: '#/components/schemas/ErroreRicettaType'
          xml:
            name: ErroreRicetta
      required:
        - erroreRicetta
    ErroreRicettaType:
      type: object
      properties:
        codEsito:
          type: string
        esito:
          type: string
        progPresc:
          type: string
        tipoErrore:
          type: string
      required:
        - codEsito
    DichiarazioneSostituzioneMedicoRichiesta:
      type: object
      properties:
        pinCode:
          type: string
        pwd:
          type: string
        cfMedicoTitolare:
          type: string
        codRegione:
          type: string
        codASLAo:
          type: string
        codStruttura:
          type: string
        codSpecializzazione:
          type: string
        cfMedicoSostituto:
          type: string
        comunicazioneAsl:
          type: string
        dataInizioSostituzione:
          type: string
        dataFineSostituzione:
          type: string
        nota:
          type: string
        opzioni:
          type: array
          items:
            $ref: '#/components/schemas/OpzioniType'
      required:
        - cfMedicoSostituto
        - cfMedicoTitolare
        - codASLAo
        - codRegione
        - codSpecializzazione
        - dataFineSostituzione
        - dataInizioSostituzione
        - pinCode
        - pwd
      xml:
        name: DichiarazioneSostituzioneMedicoRichiesta
        namespace: >-
          http://dichiarazionesostituzionemedicorichiesta.xsd.dem.sanita.finanze.it
    OpzioniType:
      type: object
      properties:
        chiave:
          type: string
        valore:
          type: string
      required:
        - chiave
        - valore
    DichiarazioneSostituzioneMedicoRicevuta:
      type: object
      properties:
        codEsitoInserimento:
          type: string
        dataInserimento:
          type: string
        elencoErrori:
          $ref: '#/components/schemas/ElencoErroriType'
          xml:
            name: ElencoErrori
        elencoComunicazioni:
          $ref: '#/components/schemas/ElencoComunicazioniType'
          xml:
            name: ElencoComunicazioni
      required:
        - codEsitoInserimento
      xml:
        name: DichiarazioneSostituzioneMedicoRicevuta
        namespace: >-
          http://dichiarazionesostituzionemedicoricevuta.xsd.dem.sanita.finanze.it
    ElencoErroriType:
      type: object
      properties:
        errore:
          type: array
          items:
            $ref: '#/components/schemas/ErroreType'
          xml:
            name: Errore
      required:
        - errore
    ErroreType:
      type: object
      properties:
        codEsito:
          type: string
        esito:
          type: string
        tipoErrore:
          type: string
      required:
        - codEsito
    LottoRichiestaNRE:
      type: object
      properties:
        codRegione:
          type: string
          xml:
            name: CodRegione
        identificativoLotto:
          type: string
          xml:
            name: IdentificativoLotto
        cfmedico:
          type: string
      required:
        - codRegione
        - identificativoLotto
      xml:
        name: LottoRichiestaNRE
        namespace: http://lottorichiesta.xsd.nre.mirsac.sanita.finanze.it
    LottoRicevutaNRE:
      type: object
      properties:
        codRegione:
          type: string
          xml:
            name: CodRegione
        codRagLotto:
          type: string
          xml:
            name: CodRagLotto
        identificativoLotto:
          type: string
          xml:
            name: IdentificativoLotto
        codLotto:
          type: string
          xml:
            name: CodLotto
        codEsito:
          type: string
          xml:
            name: CodEsito
        esito:
          type: string
          xml:
            name: Esito
        cfmedico:
          type: string
      xml:
        name: LottoRicevutaNRE
        namespace: http://lottoricevuta.xsd.nre.mirsac.sanita.finanze.it
    VisualizzaPrescrittoRichiesta:
      type: object
      properties:
        pinCode:
          type: string
        nre:
          type: string
        cfMedico:
          type: string
      required:
        - cfMedico
        - nre
        - pinCode
      xml:
        name: VisualizzaPrescrittoRichiesta
        namespace: http://visualizzaprescrittorichiesta.xsd.dem.sanita.finanze.it
    DettaglioPrescrizioneType:
